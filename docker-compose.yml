version: "3.8"

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./includes:/var/www/includes
      - ./admin:/var/www/html/admin
      - ./xss:/var/www/html/xss
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: xsslab
      DB_USER: labuser
      DB_PASS: labpass123

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: xsslab
      MYSQL_USER: labuser
      MYSQL_PASSWORD: labpass123
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "labuser", "-plabpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
